<!DOCTYPE html>

<style>
:root{--bg:#FFF6EC;--card:#fff;--main:#E8916B;--deep:#C96F4A;--dark:#5A3A2E;--soft:#FDE6D6;--lighter:#FFF0E4;--border:#F3D5C0;--muted:#8A6E62;--light:#B9A196;--bar:#F0A07C;--sb:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;font-family:"PingFang SC","Hiragino Sans GB","Noto Sans CJK SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--dark);line-height:1.6;overflow-x:hidden}
body{max-width:430px;margin:0 auto}
.screen{display:none;min-height:100dvh;flex-direction:column}.screen.active{display:flex}
#start{padding:40px 24px 32px;align-items:center;justify-content:center;text-align:center;background:linear-gradient(180deg,#FFF8F0,#FFEBDC)}
.start-cat{width:200px;height:200px;margin-bottom:8px}
.start-label{font-size:13px;color:var(--main);letter-spacing:2px;margin-bottom:8px}
h1{font-size:32px;line-height:1.3;color:var(--dark);margin-bottom:10px}

.desc{font-size:14px;color:var(--muted);margin-bottom:20px}
.pills{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}

.btn-primary{width:100%;max-width:300px;padding:16px;border:none;border-radius:28px;background:linear-gradient(135deg,#F2A27E,#E07F57);color:#fff;font-size:17px;font-weight:600;font-family:inherit;box-shadow:0 6px 20px rgba(224,127,87,.35);cursor:pointer}
.btn-primary:active{transform:scale(.97)}
.hint{margin-top:16px;font-size:12px;color:var(--light)}
.qh{padding:16px 20px 12px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5}
.qrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qback{background:none;border:none;color:var(--muted);font-size:14px;font-family:inherit;cursor:pointer}
.qprog{font-size:13px;color:var(--main);font-weight:600}
.track{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#F2A27E,#E07F57);transition:width .3s}
.qbody{padding:24px 20px}
.qemoji{font-size:40px;margin-bottom:6px}
.qno{font-size:12px;color:var(--main);font-weight:600;letter-spacing:1px;margin-bottom:8px}
.qtext{font-size:20px;font-weight:600;line-height:1.45;margin-bottom:24px}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{padding:16px 18px;background:#fff;border:1.5px solid var(--border);border-radius:16px;font-size:15px;color:var(--dark);text-align:left;font-family:inherit;cursor:pointer;line-height:1.5}
.opt.sel,.opt:active{border-color:var(--main);background:var(--lighter);color:var(--deep)}
#loading{align-items:center;justify-content:center;text-align:center}
.loader{width:40px;height:40px;border:3px solid var(--soft);border-top-color:var(--main);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 18px}@keyframes sp{to{transform:rotate(360deg)}}
#result{padding-bottom:calc(84px + var(--sb))}
.rtop{padding:14px 16px;background:#fff;display:flex;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;font-size:14px;font-weight:600}
.rtop span:last-child{font-weight:400;color:var(--light);font-size:12px}
.wrap{overflow:hidden;width:100%;touch-action:pan-y}
.slides{display:flex;width:100%;transition:transform .35s cubic-bezier(.25,.8,.25,1)}
.slide{flex:0 0 100%;width:100%;padding:18px 16px}
.card{background:#fff;border:1px solid var(--border);border-radius:18px;padding:20px 18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(224,127,87,.08)}
.st{font-size:15px;font-weight:700;margin-bottom:12px}.st b{color:var(--main)}
.portrait{width:190px;height:190px;display:block;margin:0 auto 4px}
.pct{font-size:52px;font-weight:700;color:var(--main);text-align:center;line-height:1.1}
.bname{font-size:28px;font-weight:700;text-align:center;margin:4px 0 2px}
.tagline{font-size:13px;color:var(--muted);text-align:center;margin-bottom:14px}
.tags{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.tag{padding:5px 14px;border-radius:20px;background:var(--lighter);color:var(--deep);font-size:13px;font-weight:500}
.p{font-size:14px;color:var(--muted);line-height:1.75}
.li{background:#FFFAF5;border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;font-size:13px;color:var(--muted)}
.li b{display:block;color:var(--dark);font-size:14px;margin-bottom:4px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.bl{width:56px;font-size:13px;font-weight:500}.bt{flex:1;height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bf{height:100%;background:var(--bar);border-radius:5px;width:0;transition:width .8s}
.bs{width:46px;text-align:right;font-size:12px;color:var(--deep);font-weight:600}
.speech{background:var(--lighter);border-radius:16px 16px 16px 4px;padding:12px 14px;margin-bottom:10px;font-size:14px;font-weight:500}
.swh{text-align:center;font-size:12px;color:var(--light)}
.dots{display:flex;justify-content:center;gap:7px;padding:8px 0 12px}.dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:all .25s}.dot.on{background:var(--main);width:18px;border-radius:4px}
.acts{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:12px 12px calc(12px + var(--sb));background:rgba(255,255,255,.95);border-top:1px solid var(--border);display:flex;gap:8px;z-index:20}
.acts button{flex:1;padding:13px 4px;border-radius:24px;font-size:14px;font-weight:600;font-family:inherit;cursor:pointer}
.bo{border:1.5px solid var(--main);background:#fff;color:var(--deep)}.bp{border:none;background:linear-gradient(135deg,#F2A27E,#E07F57);color:#fff}
.ov{position:fixed;inset:0;background:rgba(60,35,25,.88);z-index:200;display:none;flex-direction:column;align-items:center;padding:16px 16px calc(16px + var(--sb));overflow-y:auto}
.ov.show{display:flex}.ov img{width:100%;max-width:400px;border-radius:12px}
.ovh{color:#fff;font-size:14px;margin:8px 0 12px}
.ovb{display:flex;gap:10px;width:100%;max-width:400px;margin-top:12px}.ovb button{flex:1;padding:12px;border:none;border-radius:22px;font-size:15px;font-weight:600;font-family:inherit}
.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(90,58,46,.9);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}.toast.show{opacity:1}
</style>
</head>
<body>
<section id="start" class="screen active">
  <div class="start-cat" id="startCat"></div>
  <div class="start-label">猫咪匹配测试</div>
  <h1>你最适合养<br><span class="hl">什么猫</span>？</h1>
  <p class="desc">根据你的作息、住房和性格<br>找到和你最合拍的那只喵</p>
  <div class="pills"><span class="pill">15 道轻松小题</span><span class="pill">10 种猫咪</span><span class="pill">约 2 分钟</span></div>
  <button class="btn-primary" id="btnStart">开始测试</button>
  <p class="hint">单选 · 没有标准答案 · 结果可左右滑动</p>
</section>
<section id="quiz" class="screen">
  <div class="qh"><div class="qrow"><button class="qback" id="qback">← 上一题</button><span class="qprog" id="qprog"></span></div><div class="track"><div class="fill" id="fill"></div></div></div>
  <div class="qbody"><div class="qemoji" id="qemoji"></div><div class="qno" id="qno"></div><div class="qtext" id="qtext"></div><div class="opts" id="opts"></div></div>
</section>
<section id="loading" class="screen"><div class="loader"></div><div style="font-weight:600;color:var(--deep)">正在为你挑选猫主子…</div><div style="font-size:13px;color:var(--light);margin-top:6px">喵星人正在审核你的铲屎官资格</div></section>
<section id="result" class="screen">
  <div class="rtop"><span>你的本命猫咪</span><span id="ind">1 / 5</span></div>
  <div class="wrap" id="wrap"><div class="slides" id="slides"></div></div>
  <p class="swh">← 左右滑动查看完整结果 →</p>
  <div class="dots" id="dots"></div>
  <div class="acts"><button class="bo" id="btnRetry">再测一次</button><button class="bo" id="btnCopy">复制文案</button><button class="bp" id="btnImg">生成分享图</button></div>
</section>
<div class="ov" id="ov"><div class="ovh">长按图片保存，或点击下载</div><img id="shareImg" alt="分享图"><div class="ovb"><button id="btnDl" style="background:#fff;color:var(--deep)">下载</button><button id="btnClose" style="background:rgba(255,255,255,.18);color:#fff">关闭</button></div></div>
<div class="toast" id="toast"></div>
<script>
/* ===== CAT SVG ===== */
// c: {base, dark, accent, pattern, ears, longFur, flat, eye, nose, hairless, white}
function catSVG(c){
  const s=[];
  const B=c.base, D=c.dark||c.base, E=c.eye, N=c.nose||'#F4A6A6';
  s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">');
  s.push('<circle cx="100" cy="108" r="88" fill="'+(c.bg||'#FFE9D8')+'"/>');
  // body
  s.push('<ellipse cx="100" cy="170" rx="58" ry="34" fill="'+B+'"/>');
  if(c.white) s.push('<ellipse cx="100" cy="172" rx="30" ry="26" fill="#FFFFFF"/>');
  const fw=c.flat?64:58, fh=c.flat?52:54;
  // fluffy ruff
  if(c.longFur){let r='';for(let k=0;k<18;k++){const a=k/18*Math.PI*2;r+='<circle cx="'+(100+Math.cos(a)*(fw+4)).toFixed(1)+'" cy="'+(108+Math.sin(a)*(fh+4)).toFixed(1)+'" r="13" fill="'+B+'"/>';}s.push(r);}
  // ears
  const ear=(side)=>{const m=side<0?1:-1;let o,t,i;
    if(c.ears==='fold'){return '<path d="M'+(100+side*30)+' 62 Q'+(100+side*50)+' 50 '+(100+side*58)+' 68 Q'+(100+side*46)+' 70 '+(100+side*36)+' 74 Z" fill="'+D+'"/>';}
    if(c.ears==='big'){o=[100+side*22,70];t=[100+side*70,18];i=[100+side*64,82];}
    else if(c.ears==='small'){o=[100+side*28,62];t=[100+side*54,40];i=[100+side*58,74];}
    else {o=[100+side*24,64];t=[100+side*60,26];i=[100+side*62,80];}
    let r='<path d="M'+o+' L'+t+' L'+i+' Z" fill="'+(c.earColor||D)+'" stroke="'+(c.earColor||D)+'" stroke-width="6" stroke-linejoin="round"/>';
    const ci=[(o[0]*2+t[0]*3+i[0]*2)/7,(o[1]*2+t[1]*3+i[1]*2)/7];
    r+='<path d="M'+[(o[0]+ci[0])/2,(o[1]+ci[1])/2+4]+' L'+[(t[0]+ci[0]*2)/3,(t[1]+ci[1]*2)/3]+' L'+[(i[0]+ci[0])/2,(i[1]+ci[1])/2]+' Z" fill="#F7B9B4"/>';
    if(c.ears==='tufted') r+='<path d="M'+t+' l'+(side*-4)+' -14 l'+(side*6)+' 8 l'+(side*2)+' -12 l'+(side*2)+' 14" stroke="'+D+'" stroke-width="3" fill="none" stroke-linecap="round"/>';
    return r;};
  s.push(ear(-1),ear(1));
  // head
  s.push('<ellipse cx="100" cy="108" rx="'+fw+'" ry="'+fh+'" fill="'+B+'"/>');
  // patterns
  if(c.pattern==='point') s.push('<ellipse cx="100" cy="122" rx="'+(c.white?26:36)+'" ry="'+(c.white?26:34)+'" fill="'+D+'" opacity="0.85"/>');
  if(c.pattern==='ragdoll'){s.push('<path d="M60 92 Q100 70 140 92 Q138 130 100 128 Q62 130 60 92Z" fill="'+D+'" opacity="0.75"/>');s.push('<path d="M100 92 L84 140 Q100 150 116 140 Z" fill="#FFFFFF"/>');}
  if(c.pattern==='tabby'||c.pattern==='mackerel'){const st=c.stripe||D;
    s.push('<path d="M86 64 L90 82 M100 60 L100 80 M114 64 L110 82" stroke="'+st+'" stroke-width="5" stroke-linecap="round"/>');
    s.push('<path d="M'+(100-fw+4)+' 104 l18 3 M'+(100-fw+6)+' 116 l16 0 M'+(100+fw-4)+' 104 l-18 3 M'+(100+fw-6)+' 116 l-16 0" stroke="'+st+'" stroke-width="4" stroke-linecap="round"/>');
    s.push('<path d="M50 162 q6 8 4 18 M62 152 q6 10 4 22 M150 162 q-6 8 -4 18 M138 152 q-6 10 -4 22" stroke="'+st+'" stroke-width="4" fill="none" stroke-linecap="round"/>');}
  if(c.pattern==='orange'){s.push('<path d="M88 64 L91 80 M100 60 L100 78 M112 64 L109 80" stroke="'+D+'" stroke-width="5" stroke-linecap="round"/>');s.push('<ellipse cx="100" cy="128" rx="26" ry="18" fill="#FFF3E2"/>');}
  if(c.muzzle) s.push('<ellipse cx="100" cy="128" rx="24" ry="16" fill="'+c.muzzle+'"/>');
  if(c.hairless){s.push('<path d="M82 74 q18 -6 36 0 M86 82 q14 -4 28 0" stroke="'+D+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>');}
  // eyes
  const ey=c.flat?108:104, ex=c.flat?24:22, er=c.eyeR||11;
  [-1,1].forEach(sd=>{const x=100+sd*ex;
    s.push('<ellipse cx="'+x+'" cy="'+ey+'" rx="'+er+'" ry="'+(er+1)+'" fill="'+E+'"/>');
    s.push('<ellipse cx="'+x+'" cy="'+(ey+1)+'" rx="'+(er*0.45)+'" ry="'+(er*0.8)+'" fill="#2B1D16"/>');
    s.push('<circle cx="'+(x+3)+'" cy="'+(ey-4)+'" r="3.5" fill="#fff"/><circle cx="'+(x-3)+'" cy="'+(ey+4)+'" r="1.6" fill="#fff"/>');});
  // blush
  s.push('<ellipse cx="'+(100-fw+16)+'" cy="'+(ey+18)+'" rx="9" ry="5" fill="#FF9AA2" opacity="0.45"/><ellipse cx="'+(100+fw-16)+'" cy="'+(ey+18)+'" rx="9" ry="5" fill="#FF9AA2" opacity="0.45"/>');
  // nose & mouth
  const ny=c.flat?120:122;
  s.push('<path d="M95 '+ny+' L105 '+ny+' L100 '+(ny+6)+' Z" fill="'+N+'" stroke="'+N+'" stroke-width="2" stroke-linejoin="round"/>');
  s.push('<path d="M100 '+(ny+6)+' q-5 7 -11 3 M100 '+(ny+6)+' q5 7 11 3" stroke="#6B4A3E" stroke-width="2.2" fill="none" stroke-linecap="round"/>');
  // whiskers
  const wc=c.whisker||'#C9B3A8';
  if(!c.hairless) s.push('<path d="M76 124 L46 118 M76 129 L46 132 M124 124 L154 118 M124 129 L154 132" stroke="'+wc+'" stroke-width="1.8" stroke-linecap="round"/>');
  // paws
  s.push('<ellipse cx="80" cy="186" rx="13" ry="8" fill="'+(c.paw||B)+'"/><ellipse cx="120" cy="186" rx="13" ry="8" fill="'+(c.paw||B)+'"/>');
  s.push('</svg>');
  return s.join('');
}
const svgURL=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
